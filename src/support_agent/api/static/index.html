<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Support chat</h1>
      <div class="controls">
        <label>Demo customer <select id="customer" disabled></select></label>
        <button id="new-chat" type="button" disabled>New chat</button>
        <label><input id="debug" type="checkbox"> Debug</label>
      </div>
    </header>
    <section id="messages" role="log" aria-label="Conversation"></section>
    <form id="composer">
      <label for="message">Message</label>
      <div class="controls">
        <input id="message" type="text" autocomplete="off" required disabled>
        <button id="send" disabled>Send</button>
      </div>
    </form>
    <details id="memories-panel">
      <summary>What we remember (<span id="memories-count">0</span>)</summary>
      <div class="memories-toolbar">
        <button id="memories-refresh" type="button" disabled>Refresh</button>
        <button id="memories-clear" type="button" disabled>Forget all</button>
      </div>
      <ul id="memories-list" aria-label="Saved memories"></ul>
    </details>
    <pre id="details" aria-label="Turn details" hidden></pre>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
