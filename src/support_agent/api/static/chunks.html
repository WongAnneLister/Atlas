<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas · 文档与切块浏览器</title>
  <link rel="stylesheet" href="/static/chunks.css" />
  <script src="/static/chunks.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="/chunks" class="brand">
        <span class="logo" aria-hidden="true">A</span>
        <span class="brand-name">Atlas</span>
        <span class="brand-sep">/</span>
        <span class="brand-page">Chunks</span>
      </a>
      <nav class="nav-links" aria-label="页面导航">
        <a href="/" class="nav-link">Chat</a>
        <a href="/visualizer" class="nav-link">Visualizer</a>
        <a href="/console" class="nav-link">Console</a>
        <span class="nav-link active">Chunks</span>
      </nav>
    </div>

    <div class="topbar-right">
      <div class="snapshot-wrap">
        <span class="snapshot-label">快照</span>
        <select id="snapshot-select" class="snapshot-select" aria-label="选择切块快照"></select>
      </div>
      <div id="snapshot-stats" class="stats-inline" aria-live="polite"></div>
      <button id="theme-toggle" class="icon-btn" type="button" title="切换深浅色主题" aria-label="切换深浅色主题">
        <span id="theme-icon" aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <main class="workbench">
    <aside class="sidebar" aria-label="源文档列表">
      <div class="sidebar-head">
        <div class="sidebar-title-row">
          <span class="eyebrow">源文档</span>
          <span id="doc-count" class="count-muted">0</span>
        </div>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path fill="currentColor" d="M6.5 1.5a5 5 0 1 0 3.1 8.92l3.49 3.49a.75.75 0 1 0 1.06-1.06l-3.49-3.49A5 5 0 0 0 6.5 1.5ZM3 6.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z"/>
          </svg>
          <input id="doc-search" class="search-input" type="search" placeholder="搜索文档…" autocomplete="off" />
        </div>
        <div class="segmented" id="doc-type-filters" role="group" aria-label="文档类型">
          <button type="button" class="seg-btn active" data-filter="all">全部</button>
          <button type="button" class="seg-btn" data-filter="policy">Policy</button>
          <button type="button" class="seg-btn" data-filter="catalog">Catalog</button>
        </div>
      </div>
      <ul id="doc-list" class="doc-list"></ul>
    </aside>

    <section class="source-pane" aria-label="文档原文">
      <div class="source-topbar">
        <div class="source-title-group">
          <h1 id="doc-title" class="doc-title">选择左侧文档</h1>
          <div id="doc-meta" class="doc-meta"></div>
        </div>
        <div class="legend" aria-label="高亮说明">
          <span class="legend-item"><i class="dot dot-prev"></i>上块重叠</span>
          <span class="legend-item"><i class="dot dot-body"></i>当前块</span>
          <span class="legend-item"><i class="dot dot-next"></i>下块重叠</span>
        </div>
      </div>
      <div id="sections-container" class="source-scroll"></div>
    </section>

    <aside class="chunks-pane" aria-label="切块检查器">
      <div class="chunks-head">
        <div class="chunks-title-row">
          <div class="chunks-heading">
            <span class="eyebrow">切块</span>
            <span class="count-muted"><span id="chunk-visible-count">0</span> / <span id="chunk-total-count">0</span></span>
          </div>
          <div class="stepper">
            <button id="prev-chunk" class="step-btn" type="button" title="上一块 (↑)" disabled>↑</button>
            <button id="next-chunk" class="step-btn" type="button" title="下一块 (↓)" disabled>↓</button>
          </div>
        </div>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path fill="currentColor" d="M6.5 1.5a5 5 0 1 0 3.1 8.92l3.49 3.49a.75.75 0 1 0 1.06-1.06l-3.49-3.49A5 5 0 0 0 6.5 1.5ZM3 6.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z"/>
          </svg>
          <input id="chunk-search" class="search-input" type="search" placeholder="搜索内容、chunk_id…" autocomplete="off" />
        </div>

        <div class="filter-pills" id="chunk-filters" role="group" aria-label="切块筛选">
          <button type="button" class="pill active" data-filter="all">全部</button>
          <button type="button" class="pill" data-filter="over_max">&gt;<span id="limit-max-label">512</span></button>
          <button type="button" class="pill" data-filter="over_hard">&gt;<span id="limit-hard-label">4096</span></button>
          <button type="button" class="pill" data-filter="headed">带标题</button>
          <button type="button" class="pill" data-filter="overlap">重叠</button>
        </div>

        <div id="section-filter-banner" class="section-filter-banner" hidden>
          <span class="section-filter-text">章节：<strong id="section-filter-name"></strong></span>
          <button id="clear-section-filter" type="button" class="clear-btn">清除</button>
        </div>
      </div>

      <div id="chunks-list" class="chunks-scroll"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
