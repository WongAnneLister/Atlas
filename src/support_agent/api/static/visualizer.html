<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — 架构代码与动态流程双向联动可视化</title>
  <style>
    :root[data-theme="dark"] {
      --background: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --foreground: #e6edf3;
      --muted-foreground: #8b949e;
      --primary: #58a6ff;
      --primary-foreground: #0d1117;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --chart-1: #ff7b72;
      --chart-2: #d2a8ff;
      --chart-3: #a5d6ff;
      --chart-4: #79c0ff;
      --chart-5: #ffa657;
    }

    :root[data-theme="light"] {
      --background: #f6f8fa;
      --card: #ffffff;
      --border: #d0d7de;
      --foreground: #1f2328;
      --muted-foreground: #656d76;
      --primary: #0969da;
      --primary-foreground: #ffffff;
      --success: #1a7f37;
      --warning: #9a6700;
      --error: #cf222e;
      --chart-1: #cf222e;
      --chart-2: #8250df;
      --chart-3: #0a3069;
      --chart-4: #0550ae;
      --chart-5: #953800;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 30%, transparent);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--muted-foreground) 50%, transparent);
    }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border);
      background: var(--card);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }
    .badge-mono {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--background);
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .brand-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-size: 12px;
      transition: border-color 120ms ease, opacity 120ms ease;
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-muted { color: var(--muted-foreground); }
    .btn-muted:hover { color: var(--foreground); }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Scenario Bar */
    .scenario-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .scenario-label {
      font-size: 12px;
      color: var(--muted-foreground);
      flex-shrink: 0;
      margin-right: 4px;
    }
    .scenario-btn {
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      flex-shrink: 0;
      transition: all 140ms ease;
    }
    .scenario-btn:hover { border-color: var(--primary); }
    .scenario-btn.active {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 16%, var(--card));
      font-weight: 600;
    }

    /* Main Workspace */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Left Pane */
    .left-pane {
      display: flex;
      flex-direction: column;
      min-width: 300px;
      border-right: 1px solid var(--border);
      background: var(--card);
    }
    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--background);
      padding: 6px 8px 0;
      gap: 8px;
      flex-shrink: 0;
    }
    .file-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
    }
    .file-tab {
      padding: 6px 10px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border-radius: 6px 6px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      color: var(--muted-foreground);
      flex-shrink: 0;
      transition: color 120ms ease;
    }
    .file-tab:hover { color: var(--foreground); }
    .file-tab.active {
      background: var(--card);
      border-color: var(--border);
      color: var(--foreground);
      font-weight: 600;
      margin-bottom: -1px;
    }
    .file-meta {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      background: var(--card);
      flex-shrink: 0;
    }
    .file-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--background);
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      flex-shrink: 0;
      font-size: 11px;
    }
    .code-container {
      flex: 1;
      overflow: auto;
      padding: 8px 0;
      user-select: text;
      background: var(--background);
    }

    /* Code line styling */
    .code-line {
      display: flex;
      align-items: stretch;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      border-left: 3px solid transparent;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .code-line.linked { cursor: pointer; }
    .code-line.linked:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
    .code-line.is-hovered {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border-left-color: color-mix(in srgb, var(--primary) 65%, transparent);
    }
    .code-line.is-active {
      background: color-mix(in srgb, var(--primary) 18%, transparent);
      border-left-color: var(--primary);
    }
    .code-line.is-sim-active {
      background: color-mix(in srgb, var(--success) 18%, transparent);
      border-left-color: var(--success);
    }
    .line-num {
      user-select: none;
      width: 44px;
      min-width: 44px;
      padding: 0 10px 0 6px;
      text-align: right;
      color: var(--muted-foreground);
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
    }
    .line-dot {
      width: 14px;
      min-width: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .line-dot span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--primary);
      opacity: 0.35;
      transition: transform 120ms ease, opacity 120ms ease;
    }
    .code-line.is-active .line-dot span,
    .code-line.is-hovered .line-dot span {
      opacity: 1;
      transform: scale(1.25);
    }
    .code-line.is-sim-active .line-dot span {
      background: var(--success);
      opacity: 1;
      transform: scale(1.35);
    }
    .line-code {
      white-space: pre;
      padding-right: 16px;
      flex: 1;
    }

    .tok-kw { color: var(--chart-1); font-weight: 600; }
    .tok-fn { color: var(--chart-2); }
    .tok-str { color: var(--chart-3); }
    .tok-num { color: var(--chart-4); }
    .tok-com { color: var(--muted-foreground); font-style: italic; opacity: 0.85; }
    .tok-cls { color: var(--chart-5); font-weight: 500; }

    /* Inspector */
    .inspector {
      border-top: 1px solid var(--border);
      background: var(--card);
      padding: 10px 14px;
      flex-shrink: 0;
    }
    .insp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .insp-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .insp-badge {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
      flex-shrink: 0;
    }
    .insp-title {
      margin: 0;
      font-size: 12.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .insp-metric {
      font-size: 11.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--success);
      flex-shrink: 0;
    }
    .insp-desc {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted-foreground);
      line-height: 1.5;
    }
    .insp-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .insp-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--background);
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Resizer */
    .resizer {
      width: 5px;
      cursor: col-resize;
      background: var(--border);
      transition: background-color 120ms ease;
      flex-shrink: 0;
    }
    .resizer:hover, .resizer.dragging { background: var(--primary); }

    /* Right Pane */
    .right-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 360px;
      background: var(--background);
      position: relative;
      overflow: hidden;
    }
    .diagram-bar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .sim-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .sim-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted-foreground);
      flex-shrink: 0;
    }
    .sim-text {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .zoom-btn {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .zoom-btn:hover { border-color: var(--primary); }
    .zoom-readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      color: var(--muted-foreground);
      width: 40px;
      text-align: center;
    }
    .svg-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    .svg-viewport:active { cursor: grabbing; }
    #flow-svg { width: 100%; height: 100%; display: block; }

    /* SVG Graph Elements */
    .graph-node {
      cursor: pointer;
      transition: filter 160ms ease, opacity 160ms ease;
    }
    .graph-node rect.node-bg {
      fill: var(--card);
      stroke: var(--border);
      stroke-width: 1.5;
      transition: stroke 160ms ease, stroke-width 160ms ease, fill 160ms ease;
    }
    .graph-node:hover rect.node-bg,
    .graph-node.is-hovered rect.node-bg {
      stroke: var(--primary);
      stroke-width: 2.2;
      fill: color-mix(in srgb, var(--primary) 8%, var(--card));
    }
    .graph-node.is-active rect.node-bg {
      stroke: var(--primary);
      stroke-width: 2.6;
      fill: color-mix(in srgb, var(--primary) 13%, var(--card));
    }
    .graph-node.is-sim-visited rect.node-bg {
      stroke: var(--success);
      stroke-width: 2;
      fill: color-mix(in srgb, var(--success) 8%, var(--card));
    }
    .graph-node.is-sim-current rect.node-bg {
      stroke: var(--success);
      stroke-width: 3;
      fill: color-mix(in srgb, var(--success) 16%, var(--card));
    }
    .graph-node.is-sim-blocked rect.node-bg {
      stroke: var(--error);
      stroke-width: 3;
      fill: color-mix(in srgb, var(--error) 14%, var(--card));
    }
    .graph-node.is-dimmed { opacity: 0.34; }

    .graph-edge {
      fill: none;
      stroke: color-mix(in srgb, var(--muted-foreground) 45%, transparent);
      stroke-width: 1.6;
      transition: stroke 160ms ease, stroke-width 160ms ease, opacity 160ms ease;
    }
    .graph-edge.is-dimmed { opacity: 0.18; }
    .graph-edge.is-hovered,
    .graph-edge.is-active {
      stroke: var(--primary);
      stroke-width: 2.6;
    }
    .graph-edge.is-sim-visited {
      stroke: var(--success);
      stroke-width: 2.4;
      opacity: 0.9;
    }
    .graph-edge.is-sim-active {
      stroke: var(--success);
      stroke-width: 3.2;
      stroke-dasharray: 8 5;
      animation: flowDash 0.65s linear infinite;
    }
    .graph-edge.is-sim-blocked {
      stroke: var(--error);
      stroke-width: 3.2;
      stroke-dasharray: 8 5;
      animation: flowDash 0.65s linear infinite;
    }

    @keyframes flowDash {
      from { stroke-dashoffset: 26; }
      to { stroke-dashoffset: 0; }
    }

    .edge-label-bg {
      fill: var(--background);
      stroke: var(--border);
      stroke-width: 1;
    }
    .edge-label-text {
      fill: var(--muted-foreground);
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none;
    }

    .zone-box {
      fill: color-mix(in srgb, var(--card) 42%, transparent);
      stroke: var(--border);
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
    .zone-label {
      fill: var(--muted-foreground);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* Infra Bar */
    .infra-bar {
      border-top: 1px solid var(--border);
      background: var(--card);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .infra-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .infra-pill {
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: all 140ms ease;
    }
    .infra-pill:hover, .infra-pill.active {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 14%, var(--card));
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--muted-foreground);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <div class="brand-title-row">
            <h1 class="brand-title">Atlas 架构与动态流程可视化</h1>
            <span class="badge-mono">LangGraph · 35 Commits</span>
          </div>
          <p class="brand-sub">点击或悬停左侧代码 / 右侧节点，实时双向定位；选择场景可播放真实请求链路</p>
        </div>
      </div>

      <div class="controls">
        <button id="btn-prev" class="btn" title="上一步">⏮</button>
        <button id="btn-play" class="btn-primary">
          <span id="play-icon">▶</span>
          <span id="play-label">播放流程</span>
        </button>
        <button id="btn-next" class="btn" title="下一步">⏭</button>
        <button id="btn-speed" class="btn font-mono" title="切换播放速度">1x</button>
        <button id="btn-reset" class="btn btn-muted">重置</button>
        <button id="btn-theme" class="btn btn-muted" title="切换亮/暗主题">☀ 亮色</button>
      </div>
    </div>

    <div class="scenario-bar" id="scenario-bar">
      <span class="scenario-label">动态场景：</span>
    </div>
  </header>

  <main class="workspace">
    <!-- LEFT PANE -->
    <section id="left-pane" class="left-pane" style="width: 46%;">
      <div class="tabs-bar">
        <div class="file-tabs" id="file-tabs"></div>
        <button id="btn-toggle-view-mode" class="btn btn-muted" style="margin-bottom: 5px; flex-shrink: 0;" title="在主图编排 (build.py) 与节点实现代码之间切换">
          切换实现/编排
        </button>
      </div>

      <div class="file-meta">
        <span id="active-file-path" class="file-path">src/support_agent/graph/build.py</span>
        <span id="code-link-badge" class="link-badge">点击带圆点代码行联动右侧</span>
      </div>

      <div id="code-container" class="code-container"></div>

      <div class="inspector">
        <div class="insp-head">
          <div class="insp-left">
            <span id="insp-badge" class="insp-badge">gate</span>
            <h2 id="insp-title" class="insp-title">证据门控 (Evidence Gate)</h2>
          </div>
          <span id="insp-metric" class="insp-metric"></span>
        </div>
        <p id="insp-desc" class="insp-desc"></p>
        <div id="insp-tags" class="insp-tags"></div>
      </div>
    </section>

    <div id="resizer" class="resizer" title="拖动调整左右宽度"></div>

    <!-- RIGHT PANE -->
    <section id="right-pane" class="right-pane">
      <div class="diagram-bar">
        <div class="sim-banner">
          <span id="sim-status-dot" class="sim-dot"></span>
          <span id="sim-step-text" class="sim-text">自由探索模式 — 点击任意节点查看源码，或点击上方场景播放动态流转</span>
        </div>
        <div class="zoom-controls">
          <button id="zoom-out" class="zoom-btn" title="缩小">−</button>
          <span id="zoom-readout" class="zoom-readout">100%</span>
          <button id="zoom-in" class="zoom-btn" title="放大">+</button>
          <button id="zoom-fit" class="btn btn-muted" style="padding: 2px 8px; height: 24px;">重置视图</button>
        </div>
      </div>

      <div id="svg-viewport" class="svg-viewport">
        <svg id="flow-svg" viewBox="0 0 980 760" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="currentColor" style="color: var(--muted-foreground); opacity: 0.65;"></path>
            </marker>
            <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

          "        except Exception as error:",

          "def evaluate(query: str, chunks: list[RetrievedChunk], settings: GateSettings) -> GateResult:",
          "    threshold = settings.threshold",
          "    # 4 信号加权评分（默认权重：0.5 / 0.2 / 0.15 / 0.15）",
          "    signals = {",
          "        \"top_score\": top_score(chunks),            # top-1 重排分 (sigmoid)",
          "        \"good_count\": good_count(chunks, settings), # 高分块数量 / 3",
          "        \"margin\": margin(chunks),                  # top-1 - top-2 间隔",
          "    }",
          "    hit = key_hit(query, chunks, settings)          # 关键实体/型号命中率",
          "    if hit is not None:",
          "        signals[\"key_hit\"] = hit",
          "    score = weighted_score(signals, settings)",
          "",
          "    # 一票否决 (Veto)：特定实体或型号未出现在 top-3 块中直接拒绝",
          "    missed = settings.require_specific_term_hit and specific_term_missed(query, chunks, settings)",
          "    model_missed = settings.require_model_number_hit and model_number_missed(query, chunks, settings)",
          "    passed = bool(chunks) and not missed and not model_missed and score >= threshold",
          "",
          "    reason = (",
          "        \"passed\" if passed",
          "        else \"empty_retrieval\" if not chunks",
          "        else \"key_terms_absent\" if missed",
          "        else \"model_number_absent\" if model_missed",
          "        else \"below_threshold\"",
          "    )",
          "    return GateResult(score=score, signals=signals, passed=passed, threshold=threshold, reason=reason)"
        ],

          "        if customer_profile:",
          "            messages.append(SystemMessage(content=f\"Customer profile:\\n{customer_profile}\"))",
          "            breakpoints.append(Breakpoint(layer=\"L1_session\", ttl_s=300))",
          "",
          "        # L2_compacted: 分块压缩后的冻结摘要块（Chunked Compaction）",
          "        for idx, block in enumerate(compacted_blocks):",

          "    def _violation(self, state: ConversationState) -> OutputFlag | None:",
          "        if self.checks.prompt_leaked(state.answer): return \"prompt_leak\"",

    const PY_KEYWORDS = new Set([
      "def", "class", "return", "if", "elif", "else", "for", "in", "not", "and", "or",
      "is", "None", "True", "False", "lambda", "yield", "from", "with", "as", "try", "except"
    ]);

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightPythonLine(raw) {
      let comment = "", code = raw, inStr = null;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i];
        if ((ch === '"' || ch === "'") && raw[i - 1] !== "\\") {
          inStr = inStr === ch ? null : (inStr || ch);
        } else if (ch === "#" && !inStr) {
          code = raw.slice(0, i);
          comment = raw.slice(i);
          break;
        }
      }
      const tokenRe = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_][A-Za-z0-9_]*\b)/g;
      let out = "", last = 0, m;
      while ((m = tokenRe.exec(code)) !== null) {
        out += escapeHtml(code.slice(last, m.index));
        const tok = m[0];
        if (tok.startsWith('"') || tok.startsWith("'")) out += `<span class="tok-str">${escapeHtml(tok)}</span>`;
        else if (/^\d/.test(tok)) out += `<span class="tok-num">${tok}</span>`;
        else if (PY_KEYWORDS.has(tok)) out += `<span class="tok-kw">${tok}</span>`;
        else if (/^[A-Z][A-Za-z0-9_]+$/.test(tok)) out += `<span class="tok-cls">${tok}</span>`;
        else if (code[m.index + tok.length] === "(") out += `<span class="tok-fn">${tok}</span>`;
        else out += escapeHtml(tok);
        last = tokenRe.lastIndex;
      }
      out += escapeHtml(code.slice(last));
      if (comment) out += `<span class="tok-com">${escapeHtml(comment)}</span>`;
      return out || " ";
    }

    function findMappingForLine(fileKey, lineNum) {
      let best = null;
      for (const m of CODE_FILES[fileKey].mappings) {
        if (lineNum >= m.start && lineNum <= m.end) {
          if (!best || (m.end - m.start) < (best.end - best.start)) best = m;
        }
      }
      return best;
    }

    function renderFileTabs() {
      const tabsEl = document.getElementById("file-tabs");
      tabsEl.innerHTML = "";
      for (const [key, f] of Object.entries(CODE_FILES)) {
        const btn = document.createElement("button");
        btn.className = "file-tab" + (key === state.activeFile ? " active" : "");
        btn.textContent = f.label;
        btn.onclick = () => {
          state.activeFile = key;
          state.activeInfra = null;
          updateInfraPills();
          renderFileTabs();
          renderCode();
        };
        tabsEl.appendChild(btn);
      }
    }

    function renderCode(scrollToActive = false) {
      const file = CODE_FILES[state.activeFile];
      document.getElementById("active-file-path").textContent = file.path;
      const container = document.getElementById("code-container");
      container.innerHTML = "";
      const isSim = state.scenarioId !== null && state.stepIndex >= 0;

      file.lines.forEach((rawLine, idx) => {
        const lineNum = idx + 1;
        const mapping = findMappingForLine(state.activeFile, lineNum);
        const row = document.createElement("div");
        row.className = "code-line" + (mapping ? " linked" : "");
        row.dataset.line = lineNum;

        const inActive = state.activeLineRange && lineNum >= state.activeLineRange[0] && lineNum <= state.activeLineRange[1];
        const inHover = state.hoveredLineRange && lineNum >= state.hoveredLineRange[0] && lineNum <= state.hoveredLineRange[1];
        if (inActive) row.classList.add(isSim ? "is-sim-active" : "is-active");
        else if (inHover) row.classList.add("is-hovered");

        row.innerHTML = `<span class="line-num">${lineNum}</span><span class="line-dot">${mapping ? "<span></span>" : ""}</span><span class="line-code">${highlightPythonLine(rawLine)}</span>`;

        if (mapping) {
          row.addEventListener("mouseenter", () => {
            state.hoveredNodes = new Set(mapping.nodes);
            state.hoveredEdges = new Set(mapping.edges || []);
            state.hoveredLineRange = [mapping.start, mapping.end];
            syncCodeLineClasses();
            syncGraphClasses();
          });
          row.addEventListener("mouseleave", () => {
            state.hoveredNodes.clear();
            state.hoveredEdges.clear();
            state.hoveredLineRange = null;
            syncCodeLineClasses();
            syncGraphClasses();
          });
          row.addEventListener("click", () => {
            stopPlayback();
            clearScenarioHighlight();
            state.activeInfra = null;
            updateInfraPills();
            state.activeNodes = new Set(mapping.nodes);
            state.activeEdges = new Set(mapping.edges || []);
            state.activeLineRange = [mapping.start, mapping.end];
            state.selectedNode = mapping.nodes[0];
            syncCodeLineClasses();
            syncGraphClasses();
            updateInspector(state.selectedNode);
            document.getElementById("code-link-badge").textContent = `已联动 ${mapping.nodes.length} 个节点`;
          });
        }
        container.appendChild(row);
      });

      if (scrollToActive && state.activeLineRange) {
        const target = container.querySelector(`[data-line="${state.activeLineRange[0]}"]`);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function syncCodeLineClasses() {
      const container = document.getElementById("code-container");
      const isSim = state.scenarioId !== null && state.stepIndex >= 0;
      for (const row of container.children) {
        const lineNum = Number(row.dataset.line);
        const inActive = state.activeLineRange && lineNum >= state.activeLineRange[0] && lineNum <= state.activeLineRange[1];
        const inHover = state.hoveredLineRange && lineNum >= state.hoveredLineRange[0] && lineNum <= state.hoveredLineRange[1];
        row.classList.toggle("is-active", Boolean(inActive && !isSim));
        row.classList.toggle("is-sim-active", Boolean(inActive && isSim));
        row.classList.toggle("is-hovered", Boolean(!inActive && inHover));
      }
    }

    function kindAccentVar(kind) {
      switch (kind) {
        case "guard": return "var(--warning)";
        case "gate": case "handoff": return "var(--error)";
        case "pathA": return "var(--chart-2)";
        case "pathB": return "var(--chart-1)";
        case "pathC": return "var(--chart-4)";
        case "pathD": return "var(--chart-5)";
        case "pathE": return "var(--muted-foreground)";
        case "core": return "var(--chart-3)";
        default: return "var(--primary)";
      }
    }

    function buildSvgDiagram() {
      const ns = "http://www.w3.org/2000/svg";
      const zonesLayer = document.getElementById("zones-layer");
      const edgesLayer = document.getElementById("edges-layer");
      const nodesLayer = document.getElementById("nodes-layer");

      for (const z of ZONES) {
        const rect = document.createElementNS(ns, "rect");
        rect.setAttribute("x", z.x); rect.setAttribute("y", z.y);
        rect.setAttribute("width", z.w); rect.setAttribute("height", z.h);
        rect.setAttribute("rx", 10); rect.setAttribute("class", "zone-box");
        zonesLayer.appendChild(rect);

        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", z.x + 12); text.setAttribute("y", z.y + 18);
        text.setAttribute("class", "zone-label"); text.textContent = z.label;
        zonesLayer.appendChild(text);
      }

      for (const e of EDGES) {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("id", `edge-${e.id}`);
        path.setAttribute("d", e.d);
        path.setAttribute("class", "graph-edge");
        path.setAttribute("marker-end", "url(#arrow-default)");
        edgesLayer.appendChild(path);

        if (e.label) {
          const len = path.getTotalLength();
          const pt = path.getPointAtLength(len * 0.48);
          const w = e.label.length * 6.5 + 10;
          const g = document.createElementNS(ns, "g");
          const bg = document.createElementNS(ns, "rect");
          bg.setAttribute("x", pt.x - w / 2); bg.setAttribute("y", pt.y - 8);
          bg.setAttribute("width", w); bg.setAttribute("height", 15);
          bg.setAttribute("rx", 4); bg.setAttribute("class", "edge-label-bg");
          const lbl = document.createElementNS(ns, "text");
          lbl.setAttribute("x", pt.x); lbl.setAttribute("y", pt.y + 3);
          lbl.setAttribute("text-anchor", "middle"); lbl.setAttribute("class", "edge-label-text");
          lbl.textContent = e.label;
          g.appendChild(bg); g.appendChild(lbl);
          edgesLayer.appendChild(g);
        }
      }

      for (const n of NODES) {
        const g = document.createElementNS(ns, "g");
        g.setAttribute("id", `node-${n.id}`);
        g.setAttribute("class", "graph-node");
        g.setAttribute("transform", `translate(${n.x}, ${n.y})`);

        const bg = document.createElementNS(ns, "rect");
        bg.setAttribute("width", n.w); bg.setAttribute("height", n.h);
        bg.setAttribute("rx", 9); bg.setAttribute("class", "node-bg");

        const bar = document.createElementNS(ns, "rect");
        bar.setAttribute("x", 0); bar.setAttribute("y", 6);
        bar.setAttribute("width", 4); bar.setAttribute("height", n.h - 12);
        bar.setAttribute("rx", 2); bar.setAttribute("fill", kindAccentVar(n.kind));

        const title = document.createElementNS(ns, "text");
        title.setAttribute("x", 13); title.setAttribute("y", n.h / 2 - 4);
        title.setAttribute("fill", "var(--foreground)");
        title.setAttribute("font-size", "12.5"); title.setAttribute("font-weight", "600");
        title.setAttribute("font-family", "ui-monospace, SFMono-Regular, Menlo, monospace");
        title.textContent = n.label;

        const sub = document.createElementNS(ns, "text");
        sub.setAttribute("x", 13); sub.setAttribute("y", n.h / 2 + 13);
        sub.setAttribute("fill", "var(--muted-foreground)");
        sub.setAttribute("font-size", "10.5"); sub.textContent = n.sub;

        g.appendChild(bg); g.appendChild(bar); g.appendChild(title); g.appendChild(sub);

        g.addEventListener("mouseenter", () => {
          state.hoveredNodes = new Set([n.id]);
          state.hoveredEdges = new Set(EDGES.filter(e => e.from === n.id || e.to === n.id).map(e => e.id));
          if (state.activeFile === "build.py") state.hoveredLineRange = n.buildLines;
          else if (state.activeFile === n.implFile) state.hoveredLineRange = n.implLines;
          syncGraphClasses();
          syncCodeLineClasses();
        });
        g.addEventListener("mouseleave", () => {
          state.hoveredNodes.clear();
          state.hoveredEdges.clear();
          state.hoveredLineRange = null;
          syncGraphClasses();
          syncCodeLineClasses();
        });
        g.addEventListener("click", (ev) => {
          ev.stopPropagation();
          selectNodeFromDiagram(n.id, false);
        });
        nodesLayer.appendChild(g);
      }
    }

    function selectNodeFromDiagram(nodeId, preferImpl = false) {
      stopPlayback();
      clearScenarioHighlight();
      state.activeInfra = null;
      updateInfraPills();
      const n = NODE_MAP[nodeId];
      if (!n) return;
      state.selectedNode = nodeId;
      state.activeNodes = new Set([nodeId]);
      state.activeEdges = new Set(EDGES.filter(e => e.from === nodeId || e.to === nodeId).map(e => e.id));

      if (preferImpl) {
        state.activeFile = n.implFile; state.activeLineRange = n.implLines;
      } else if (state.activeFile === "build.py") {
        state.activeLineRange = n.buildLines;
      } else if (n.implFile !== "build.py") {
        state.activeFile = n.implFile; state.activeLineRange = n.implLines;
      } else {
        state.activeFile = "build.py"; state.activeLineRange = n.buildLines;
      }

      renderFileTabs();
      renderCode(true);
      syncGraphClasses();
      updateInspector(nodeId);
      document.getElementById("code-link-badge").textContent = `定位 ${state.activeFile} L${state.activeLineRange[0]}–${state.activeLineRange[1]}`;
    }

    function syncGraphClasses() {
      const isSim = state.scenarioId !== null && state.stepIndex >= 0;
      const scenario = isSim ? SCENARIOS.find(s => s.id === state.scenarioId) : null;
      const visitedNodes = new Set(), visitedEdges = new Set();
      let currentNode = null, currentEdge = null, currentBlocked = false;

      if (scenario) {
        for (let i = 0; i <= state.stepIndex; i++) {
          const st = scenario.steps[i];
          if (i < state.stepIndex) {
            visitedNodes.add(st.node);
            if (st.edge) visitedEdges.add(st.edge);
          } else {
            currentNode = st.node;
            currentEdge = st.edge;
            currentBlocked = st.status === "blocked";
          }
        }
      }

      for (const n of NODES) {
        const el = document.getElementById(`node-${n.id}`);
        if (!el) continue;
        el.classList.remove("is-hovered", "is-active", "is-sim-visited", "is-sim-current", "is-sim-blocked", "is-dimmed");
        if (isSim) {
          if (n.id === currentNode) el.classList.add(currentBlocked ? "is-sim-blocked" : "is-sim-current");
          else if (visitedNodes.has(n.id)) el.classList.add("is-sim-visited");
          else el.classList.add("is-dimmed");
        } else {
          if (state.activeNodes.has(n.id)) el.classList.add("is-active");
          if (state.hoveredNodes.has(n.id)) el.classList.add("is-hovered");
        }
      }

      for (const e of EDGES) {
        const el = document.getElementById(`edge-${e.id}`);
        if (!el) continue;
        el.classList.remove("is-hovered", "is-active", "is-sim-visited", "is-sim-active", "is-sim-blocked", "is-dimmed");
        if (isSim) {
          if (e.id === currentEdge) {
            el.classList.add(currentBlocked ? "is-sim-blocked" : "is-sim-active");
            el.setAttribute("marker-end", currentBlocked ? "url(#arrow-error)" : "url(#arrow-sim)");
          } else if (visitedEdges.has(e.id)) {
            el.classList.add("is-sim-visited");
            el.setAttribute("marker-end", "url(#arrow-sim)");
          } else {
            el.classList.add("is-dimmed");
            el.setAttribute("marker-end", "url(#arrow-default)");
          }
        } else {
          const isAct = state.activeEdges.has(e.id);
          const isHov = state.hoveredEdges.has(e.id);
          if (isAct) el.classList.add("is-active");
          if (isHov) el.classList.add("is-hovered");
          el.setAttribute("marker-end", (isAct || isHov) ? "url(#arrow-active)" : "url(#arrow-default)");
        }
      }
    }

    function animatePacketAlongEdge(edgeId, blocked = false) {
      const layer = document.getElementById("packet-layer");
      layer.innerHTML = "";
      if (!edgeId) return;
      const path = document.getElementById(`edge-${edgeId}`);
      if (!path) return;
      const ns = "http://www.w3.org/2000/svg";
      const circle = document.createElementNS(ns, "circle");
      circle.setAttribute("r", "5.5");
      circle.setAttribute("fill", blocked ? "var(--error)" : "var(--success)");
      circle.setAttribute("filter", "url(#glow-sim)");
      layer.appendChild(circle);

      const total = path.getTotalLength();
      const duration = Math.min(520, state.speedMs * 0.55);
      const startTs = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - startTs) / duration);
        const pt = path.getPointAtLength(total * (1 - Math.pow(1 - t, 2)));
        circle.setAttribute("cx", pt.x);
        circle.setAttribute("cy", pt.y);
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function updateInspector(nodeId) {
      const n = NODE_MAP[nodeId];
      if (!n) return;
      document.getElementById("insp-badge").textContent = n.label;
      document.getElementById("insp-title").textContent = n.title;
      document.getElementById("insp-metric").textContent = n.metric || "";
      document.getElementById("insp-desc").textContent = n.desc;
      document.getElementById("insp-tags").innerHTML = n.tags.map(t => `<span class="insp-tag">${t}</span>`).join("");
    }

    function renderScenarioBar() {
      const bar = document.getElementById("scenario-bar");
      for (const sc of SCENARIOS) {
        const btn = document.createElement("button");
        btn.className = "scenario-btn";
        btn.dataset.scenario = sc.id;
        btn.textContent = sc.name;
        btn.onclick = () => startScenario(sc.id, true);
        bar.appendChild(btn);
      }
    }

    function updateScenarioButtons() {
      document.querySelectorAll(".scenario-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.scenario === state.scenarioId);
      });
    }

    function startScenario(scenarioId, autoPlay = true) {
      stopPlayback();
      state.activeInfra = null;
      updateInfraPills();
      state.scenarioId = scenarioId;
      state.stepIndex = 0;
      updateScenarioButtons();
      applyScenarioStep();
      if (autoPlay) startPlayback();
    }

    function applyScenarioStep() {
      const sc = SCENARIOS.find(s => s.id === state.scenarioId);
      if (!sc || state.stepIndex < 0 || state.stepIndex >= sc.steps.length) return;
      const step = sc.steps[state.stepIndex];
      state.selectedNode = step.node;
      state.activeFile = step.file;
      state.activeLineRange = step.lines;

      renderFileTabs();
      renderCode(true);
      syncGraphClasses();
      updateInspector(step.node);
      animatePacketAlongEdge(step.edge, step.status === "blocked");

      document.getElementById("sim-status-dot").style.background = step.status === "blocked" ? "var(--error)" : "var(--success)";
      document.getElementById("sim-step-text").textContent = `[${state.stepIndex + 1}/${sc.steps.length}] ${step.node} — ${step.msg}`;
      document.getElementById("code-link-badge").textContent = `场景回放 · ${step.file} L${step.lines[0]}–${step.lines[1]}`;
      document.getElementById("btn-prev").disabled = state.stepIndex <= 0;
      document.getElementById("btn-next").disabled = state.stepIndex >= sc.steps.length - 1;
    }

    function startPlayback() {
      if (!state.scenarioId) { startScenario(SCENARIOS[0].id, true); return; }
      const sc = SCENARIOS.find(s => s.id === state.scenarioId);
      if (state.stepIndex >= sc.steps.length - 1) { state.stepIndex = 0; applyScenarioStep(); }
      state.isPlaying = true;
      updatePlayButton();
      clearInterval(state.timer);
      state.timer = setInterval(() => {
        if (state.stepIndex < sc.steps.length - 1) { state.stepIndex++; applyScenarioStep(); }
        else stopPlayback();
      }, state.speedMs);
    }

    function stopPlayback() {
      state.isPlaying = false;
      clearInterval(state.timer);
      state.timer = null;
      updatePlayButton();
    }

    function updatePlayButton() {
      document.getElementById("play-icon").textContent = state.isPlaying ? "⏸" : "▶";
      document.getElementById("play-label").textContent = state.isPlaying ? "暂停" : "播放流程";
    }

    function clearScenarioHighlight() {
      state.scenarioId = null;
      state.stepIndex = -1;
      document.getElementById("packet-layer").innerHTML = "";
      document.getElementById("sim-status-dot").style.background = "var(--muted-foreground)";
      document.getElementById("sim-step-text").textContent = "自由探索模式 — 点击任意节点查看源码，或点击上方场景播放动态流转";
      updateScenarioButtons();
    }

    function updateInfraPills() {
      document.querySelectorAll(".infra-pill").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.infra === state.activeInfra);
      });
    }

    function applyTransform() {
      document.getElementById("pan-zoom-group").setAttribute("transform", `translate(${state.tx}, ${state.ty}) scale(${state.scale})`);
      document.getElementById("zoom-readout").textContent = `${Math.round(state.scale * 100)}%`;
    }

    function setupPanZoom() {
      const viewport = document.getElementById("svg-viewport");
      let dragging = false, startX = 0, startY = 0, origTx = 0, origTy = 0;
      viewport.addEventListener("mousedown", (e) => {
        if (e.target.closest(".graph-node")) return;
        dragging = true; startX = e.clientX; startY = e.clientY; origTx = state.tx; origTy = state.ty;
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        state.tx = origTx + (e.clientX - startX);
        state.ty = origTy + (e.clientY - startY);
        applyTransform();
      });
      window.addEventListener("mouseup", () => { dragging = false; });
      viewport.addEventListener("wheel", (e) => {
        e.preventDefault();
        state.scale = Math.min(2.2, Math.max(0.55, state.scale * (e.deltaY < 0 ? 1.1 : 0.91)));
        applyTransform();
      }, { passive: false });
      document.getElementById("zoom-in").onclick = () => { state.scale = Math.min(2.2, state.scale * 1.15); applyTransform(); };
      document.getElementById("zoom-out").onclick = () => { state.scale = Math.max(0.55, state.scale / 1.15); applyTransform(); };
      document.getElementById("zoom-fit").onclick = () => { state.scale = 1; state.tx = 0; state.ty = 0; applyTransform(); };
    }

    function setupResizer() {
      const resizer = document.getElementById("resizer");
      const leftPane = document.getElementById("left-pane");
      let dragging = false;
      resizer.addEventListener("mousedown", () => { dragging = true; resizer.classList.add("dragging"); });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        leftPane.style.width = `${Math.min(68, Math.max(26, (e.clientX / window.innerWidth) * 100))}%`;
      });
      window.addEventListener("mouseup", () => { dragging = false; resizer.classList.remove("dragging"); });
    }

    function init() {
      renderScenarioBar();
      buildSvgDiagram();
      renderFileTabs();
      renderCode(false);
      syncGraphClasses();
      updateInspector(state.selectedNode);
      setupPanZoom();
      setupResizer();

      document.getElementById("btn-play").onclick = () => state.isPlaying ? stopPlayback() : startPlayback();
      document.getElementById("btn-prev").onclick = () => {
        stopPlayback();
        if (state.scenarioId && state.stepIndex > 0) { state.stepIndex--; applyScenarioStep(); }
      };
      document.getElementById("btn-next").onclick = () => {
        stopPlayback();
        if (!state.scenarioId) { startScenario(SCENARIOS[0].id, false); return; }
        const sc = SCENARIOS.find(s => s.id === state.scenarioId);
        if (state.stepIndex < sc.steps.length - 1) { state.stepIndex++; applyScenarioStep(); }
      };
      document.getElementById("btn-speed").onclick = () => {
        state.speedMs = state.speedMs === 1100 ? 550 : 1100;
        document.getElementById("btn-speed").textContent = state.speedMs === 1100 ? "1x" : "2x";
        if (state.isPlaying) startPlayback();
      };
      document.getElementById("btn-reset").onclick = () => {
        stopPlayback(); clearScenarioHighlight(); state.activeInfra = null; updateInfraPills();
        state.activeFile = "build.py"; state.selectedNode = "gate";
        state.activeNodes = new Set(["gate"]); state.activeEdges = new Set(["e_ret_gate", "e_gate_ans", "e_gate_ho"]);
        state.activeLineRange = [35, 35];
        renderFileTabs(); renderCode(true); syncGraphClasses(); updateInspector("gate");
      };
      document.getElementById("btn-theme").onclick = () => {
        const root = document.documentElement;
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        document.getElementById("btn-theme").textContent = next === "dark" ? "☀ 亮色" : "☾ 暗色";
      };
      document.getElementById("btn-toggle-view-mode").onclick = () => {
        const n = NODE_MAP[state.selectedNode];
        if (!n) return;
        if (state.activeFile === "build.py" && n.implFile !== "build.py") {
          selectNodeFromDiagram(n.id, true);
        } else {
          state.activeFile = "build.py"; state.activeLineRange = n.buildLines;
          renderFileTabs(); renderCode(true);
          document.getElementById("code-link-badge").textContent = `编排视角 · build.py L${n.buildLines[0]}–${n.buildLines[1]}`;
        }
      };
      document.querySelectorAll(".infra-pill").forEach(btn => {
        btn.onclick = () => {
          stopPlayback(); clearScenarioHighlight();
          const key = btn.dataset.infra, info = INFRA_LINKS[key];
          state.activeInfra = key; updateInfraPills();
          state.activeFile = info.file; state.activeLineRange = info.lines;
          state.activeNodes = new Set(info.nodes); state.activeEdges = new Set();
          state.selectedNode = info.nodes[0];
          renderFileTabs(); renderCode(true); syncGraphClasses(); updateInspector(state.selectedNode);
          document.getElementById("code-link-badge").textContent = `横切底座联动 ${info.nodes.length} 个节点`;
        };
      });
    }

    init();
  </script>
</body>
</html>
