# Every threshold, weight, model name and top-k lives here (AGENTS.md §5.4).
# Override any key with env vars, e.g. SUPPORT_AGENT__RETRIEVAL__RRF_K=30.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  docs:
    near_duplicate_threshold: 0.94
    minimum_coverage: 0.98
    # A missing fast model assigns leftovers to 'other'; configured models are cached.
    classify_leftovers: true
    model_pattern: '\b(?:BHD\d+/\d+|HD\d+X|TAH\d+|\d+E\d+N\d+A)\b'
    product_categories:
      BHD: hair_dryers
      HD: air_fryers
      TAH: headphones
      monitor: monitors
    topic_rules:
      refunds: '\b(refund\w*|reimburse\w*)\b'
      returns: '\b(return\w*|exchange\w*|replacement\w*|replac\w*)\b'
      warranty: '\b(warrant\w*|guarantee\w*|repair\w*|installation)\b'
      shipping: '\b(ship\w*|deliver\w*|tracking|track|package|courier|pickup)\b'
      membership: '\b(account|login|log in|password|sign up|register|membership|member|plus|supercoins|loyalty|subscription)\b'
      payments: '\b(pay\w*|card\w*|emi|wallet|invoice|billing|gst|tax|fee\w*|financ\w*|loan\w*)\b'
      orders: '\b(order\w*|cancel\w*|checkout|shopping|purchase\w*|buy\w*|stock|cart)\b'
  # Pinned to a commit hash; bump the revision on purpose, never float on "main".
  # The PRD's qgyd2021/e_commerce_customer_service was removed from the Hub (see docs/DATA_NOTES.md).
  sources:
    - name: flipkart_faqs
      repo_id: NebulaByte/E-Commerce_FAQs
      revision: 66a7c3105e6001ce7a314f113597b27a7b2e6228
      role: main knowledge base (FAQ question/answer by category)
      files: [FAQs.csv]
      # Set when the card license may not come from the copyright owner. Forces "unclear".
      third_party_note: >-
        Answers are copied from flipkart.com help pages (faq_url column). The uploader
        is not Flipkart, so the card's license may not cover the text.
    - name: philips_manuals
      repo_id: InfiniFlow/Ecommerce-Customer-Service-Workflow
      revision: 563e41c016e3d27a4501785e76cc0f3e6fd3fc84
      role: product info and manuals (model-number questions)
      files: [product_infomation.zip, user_guide.zip]
      third_party_note: >-
        The PDFs are Philips product leaflets and user manuals. The uploader is not
        Philips, so the card's license may not cover the documents.
    - name: maktek_faqs
      repo_id: MakTek/Customer_support_faqs_dataset
      revision: 858a539411eaeb97cc2c78e3262d067abe8fa240
      role: extra generic FAQs
      files: [train_expanded.json]
    - name: bitext
      repo_id: bitext/Bitext-customer-support-llm-chatbot-training-dataset
      revision: 430d1a89bd93bd1fa23c16f29dd53e73f0087443
      role: intent labels and colloquial utterances
      files: [Bitext_Sample_Customer_Support_Training_Dataset_27K_responses-v11.csv]

llm:
  provider: null        # env LLM_PROVIDER wins, e.g. "openai", "anthropic"
  fast_model: null      # env LLM_FAST_MODEL wins; used for rewrite + intent
  main_model: null      # env LLM_MAIN_MODEL wins; used for answers
  temperature: 0.0
  timeout_s: 30

retrieval:
  embedding_model: BAAI/bge-m3
  embedding_dim: 1024
  reranker_model: BAAI/bge-reranker-v2-m3
  dense_top_k: 50
  bm25_top_k: 50
  rrf_k: 60
  rerank_top_k: 5

gate:
  weights:
    top_score: 0.5
    good_count: 0.2
    margin: 0.15
    key_hit: 0.15
  good_evidence_min: 0.5   # placeholder; revisited in commit 11
  good_count_cap: 3
  threshold: null          # set by `make sweep` (commit 13); never by hand

agent:
  max_steps: 5

intent:
  min_confidence: 0.6      # placeholder; revisited in commit 09

milvus:
  uri: http://localhost:19530
  collection: support_chunks

orders:
  db_path: data/orders.sqlite
  seed: 42
  n_orders: 300
  n_customers: 50
  today: '2026-11-09'
  currency: USD
  recent_limit: 5
  min_items: 1
  max_items: 4
  max_quantity: 3
  min_unit_price_cents: 1500
  max_unit_price_cents: 50000
  max_order_age_days: 120
  delivery_ages_days: [5, 29, 31, 90]
  shipping_lead_days: 3
  transit_age_days: 7
  tracking_delay_days: 10
  coupon_probability: 0.25
  final_sale_probability: 0.10
  coupon_code: DEMO10
  coupon_discount: 0.10
  fallback_products:
    - {product_id: demo-w40, model: W40, name: Demo W40 Fan, category: home}
    - {product_id: demo-w40-pro, model: W40 Pro, name: Demo W40 Pro Fan, category: home}
    - {product_id: demo-w400, model: W400, name: Demo W400 Headphones, category: electronics}
    - {product_id: demo-shirt, model: T100, name: Demo T100 Shirt, category: clothing}

memory:                    # P1 placeholders
  recent_turns: 6
  summary_max_tokens: 400

tracing:
  enabled: false

api:
  host: 127.0.0.1
  port: 8000
