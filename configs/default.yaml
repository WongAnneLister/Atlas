# Every threshold, weight, model name and top-k lives here (AGENTS.md §5.4).
# Override any key with env vars, e.g. SUPPORT_AGENT__RETRIEVAL__RRF_K=30.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  docs:
    near_duplicate_threshold: 0.94
    minimum_coverage: 0.98
    # A missing fast model assigns leftovers to 'other'; configured models are cached.
    classify_leftovers: true
    model_pattern: '\b(?:BHD\d+/\d+|HD\d+X|TAH\d+|\d+E\d+N\d+A)\b'
    product_categories:
      BHD: hair_dryers
      HD: air_fryers
      TAH: headphones
      monitor: monitors
    topic_rules:
      refunds: '\b(refund\w*|reimburse\w*)\b'
      returns: '\b(return\w*|exchange\w*|replacement\w*|replac\w*)\b'
      warranty: '\b(warrant\w*|guarantee\w*|repair\w*|installation)\b'
      shipping: '\b(ship\w*|deliver\w*|tracking|track|package|courier|pickup)\b'
      membership: '\b(account|login|log in|password|sign up|register|membership|member|plus|supercoins|loyalty|subscription)\b'
      payments: '\b(pay\w*|card\w*|emi|wallet|invoice|billing|gst|tax|fee\w*|financ\w*|loan\w*)\b'
      orders: '\b(order\w*|cancel\w*|checkout|shopping|purchase\w*|buy\w*|stock|cart)\b'
  # Pinned to a commit hash; bump the revision on purpose, never float on "main".
  # The PRD's qgyd2021/e_commerce_customer_service was removed from the Hub (see docs/DATA_NOTES.md).
  sources:
    - name: flipkart_faqs
      repo_id: NebulaByte/E-Commerce_FAQs
      revision: 66a7c3105e6001ce7a314f113597b27a7b2e6228
      role: main knowledge base (FAQ question/answer by category)
      files: [FAQs.csv]
      # Set when the card license may not come from the copyright owner. Forces "unclear".
      third_party_note: >-
        Answers are copied from flipkart.com help pages (faq_url column). The uploader
        is not Flipkart, so the card's license may not cover the text.
    - name: philips_manuals
      repo_id: InfiniFlow/Ecommerce-Customer-Service-Workflow
      revision: 563e41c016e3d27a4501785e76cc0f3e6fd3fc84
      role: product info and manuals (model-number questions)
      files: [product_infomation.zip, user_guide.zip]
      third_party_note: >-
        The PDFs are Philips product leaflets and user manuals. The uploader is not
        Philips, so the card's license may not cover the documents.
    - name: maktek_faqs
      repo_id: MakTek/Customer_support_faqs_dataset
      revision: 858a539411eaeb97cc2c78e3262d067abe8fa240
      role: extra generic FAQs
      files: [train_expanded.json]
    - name: bitext
      repo_id: bitext/Bitext-customer-support-llm-chatbot-training-dataset
      revision: 430d1a89bd93bd1fa23c16f29dd53e73f0087443
      role: intent labels and colloquial utterances
      files: [Bitext_Sample_Customer_Support_Training_Dataset_27K_responses-v11.csv]

llm:
  provider: null        # env LLM_PROVIDER wins, e.g. "openai", "anthropic"
  fast_model: null      # env LLM_FAST_MODEL wins; used for rewrite, planning and intent
  main_model: null      # env LLM_MAIN_MODEL wins; used for answers
  temperature: 0.0
  timeout_s: 30
  provider_max_retries: 0
  fallbacks:            # LLM_FAST_FALLBACKS and LLM_MAIN_FALLBACKS accept comma lists
    fast: []
    main: []
  model_kwargs: {}      # provider-specific options; credentials still come only from env

reliability:
  timeouts_s:
    input_guard: 8
    rewrite: 30
    plan: 8
    classify: 30
    answer: 30
    decide: 30
    order_extract: 30
    grounding: 30
    verify: 30
    complaint: 30
    tools: 30
    summarise: 20
    extract_facts: 15
    rerank: 60
    orders_db: 15
    # Milvus keeps its deadline in milvus.timeout_s.
  retry:
    max_attempts: 3
    base_delay_s: 0.25
    max_delay_s: 1
    jitter_ratio: 0.2
    budget_s: 185
  circuit:
    failure_threshold: 3
    cool_down_s: 30
    half_open_max_calls: 1
  locks:
    # The stream renews the lease every renew_interval_s, so the TTL only bounds how long
    # a crashed holder blocks its conversation. Keep it a few renewal intervals long.
    conversation_ttl_s: 60
    renew_interval_s: 15
  metrics:
    latency_buckets_s: [0.1, 0.25, 0.5, 1, 2, 5, 10, 20, 30, 60, 120, 300, 600]
  repair_error_max_chars: 600
  llm_max_in_flight: 16

chaos:
  enabled: false
  seed: 42
  llm_timeout_rate: 0
  llm_rate_limit_rate: 0
  llm_garbage_rate: 0
  rerank_down_rate: 0
  milvus_down_rate: 0
  orders_down_rate: 0

retrieval:
  embedding_model: BAAI/bge-m3
  embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
  embedding_dim: 1024
  embedding_cache_dir: .cache/embeddings
  embedding_device: cpu
  embedding_batch_size: 1
  embedding_normalize: true
  embedding_use_fp16: false
  embedding_cpu_threads: 2
  embedding_max_tokens: 8192
  # Whole product manuals use weighted, non-overlapping encoder windows; no text is truncated.
  embedding_window_tokens: 1024
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  reranker_cache_dir: .cache/reranker
  reranker_device: cpu
  reranker_use_fp16: false
  reranker_batch_size: 4
  reranker_max_tokens: 512
  reranker_cpu_threads: 2
  rerank_candidates_k: 50
  dense_top_k: 50
  bm25_top_k: 50
  search_top_k: 5
  bm25_normalise_model_numbers: true
  rrf_k: 60
  rerank_top_k: 5
  # The same FAQ is filed under two topics; identical text must not take two slots.
  # On for the faq_unit index only; see eval/reports/chunking.md.
  dedupe_text: false
  # A question naming exactly one store only sees that store's sections plus
  # store-neutral ones (product catalog). See eval/reports/store_scope.md.
  filters:
    enabled: true
    category: true
    category_terms:
      hair_dryers: [hair dryer, hair dryers, blow dryer, blow dryers]
      air_fryers: [air fryer, air fryers, airfryer, airfryers]
      headphones: [headphone, headphones, headset, headsets]
      monitors: [monitor, monitors]
  store_scope:
    enabled: true
    pool_k: 10
    stores:
      flipkart: {query_pattern: '\bflipkart\b', section_marker: '.flipkart_faqs.'}
      generic: {query_pattern: '\bgeneric store\b', section_marker: '.maktek_faqs.'}

retrieval_eval:
  metric_ks: [1, 3, 5]
  target_recall_at_5: 0.95
  cache_dir: .cache/retrieval
  heading_ablation_collection: support_chunks_eval_no_heading
  baseline_collection: support_chunks_eval_heading_on
  run_ablations: true
  # All modes use the same verified local source text; Milvus returns ids and scores.
  local_chunk_text: true

chunk:
  max_tokens: 512
  overlap_tokens: 64
  prepend_heading: true
  # faq_unit: one FAQ per chunk, headed manual windows. It is not the default yet:
  # it raised no-answer false accepts end to end (eval/reports/chunking_e2e.md).
  strategy: token
  product_window_tokens: 400
  product_overlap_tokens: 50
  product_window_header: true

gate:
  weights:
    top_score: 0.5
    good_count: 0.2
    margin: 0.15
    key_hit: 0.15
  good_evidence_min: 0.5   # placeholder; revisited in commit 11
  good_count_cap: 3
  policy_nouns: [refund, return, warranty, coupon, shipping, delivery, exchange, cancellation, payment]
  untuned_threshold: 0.5   # explicit demo/test placeholder; commit 13 replaces via sweep
  threshold: 0.15 # selected by eval/reports/threshold_sweep.md at 9d9ee8ea72ebeefb3eeb557bce8d31d179c23d13
  # Round three (eval/reports/gate_round3.md). Earlier behaviour: neutral, false, false, lowest.
  key_hit_without_terms: exclude
  entity_terms: true
  require_specific_term_hit: true
  require_model_number_hit: true   # eval/reports/model_veto.md; dev thresholds unchanged
  key_hit_top_chunks: 3
  scope_terms: [flipkart, generic store]
  entity_stopwords: [i, i'm, i've, i'd, i'll, a, an, the, for, and, or, also, but, if, so, to, of, in, "on", at, by, with, from,
    what, why, when, where, which, who, whom, whose, how, can, could, do, does, did, is, are, was, were, will, would,
    should, shall, may, might, must, have, has, had, be, my, me, we, our, you, your, it, its, this, that, these, those,
    there, please, hi, hello, hey, thanks, ok, "yes", "no", not, as, any, all, some, regarding, mean, rather, than]
  threshold_rule: midpoint

agent:
  max_steps: 5
  max_consecutive_tool_errors: 2
  max_tool_calls_per_step: 3
  trace_max_chars: 160
  complaint_max_sentences: 2
  knowledge_fallback: true   # see eval/reports/tools_fallback.md
  order_replies: template    # code renders order replies; see eval/reports/order_replies.md
  order_grounding: false     # free_text mode only; failed in eval/reports/order_grounding.md
  grounding_attempts: 2  # Standalone grounding evaluation control.

refund:
  policy_query: store_faq      # was order_fields; see eval/reports/refund_policy.md
  policy_store: generic        # the mock orders are sold by the generic store (USD)
  store_label: generic store   # must match retrieval.store_scope.stores.generic.query_pattern
  decision_version: v2         # was v1; see eval/reports/refund_decisions.md

intent:
  min_confidence: 0.6      # flag only; not calibrated as an answer-safety threshold
  rewrite_history_turns: 6

graph:
  checkpoint_backend: memory
  checkpoint_path: data/checkpoints.sqlite

planning:
  enabled: true
  max_parts: 3
  min_question_marks: 2
  long_query_words: 45

knowledge:
  partial_answers: true

intent_eval:
  seed: 42
  per_intent: 50
  extra_per_kind: 40
  bitext_holdout_fraction: 0.2
  extra_drafts: eval/drafts/intent_extra.yaml
  cache_dir: .cache/intent
  max_concurrency: 4
  target_accuracy: 0.9

grounding:
  enabled: true
  split_compound: false
  verifier_role: fast
  short_sentence_words: 3
  generic_phrases:
    - "You can contact support for help."
    - "I can connect you with an agent."
  target_recall: 0.90   # preregistered verifier recall target

eval:
  claims:
    seed: 25
    dev_target: 80
    test_target: 150
    synthetic_per_split: 60
    foreign_min_words: 6
    uncited_cap_divisor: 3
    min_duration: 5
    min_amount: 5
    max_per_item: 3
  multipart_min_overlap: 0.25  # minimum word Jaccard when part counts differ
  # Opt-in speed-ups for the real-model end-to-end evaluators (e2e_eval, multipart_eval).
  # Neither changes what a run measures, so both stay out of the run's config hash.
  e2e_speed:
    # Reuse cross-encoder logits from index.release.rerank_cache.path, keyed exactly as the
    # release-evidence path keys them. CLI: --rerank-cache / --no-rerank-cache.
    rerank_cache: false
    # Upper bound for --workers (default 1). Items share one reranker worker and the API;
    # each queued rerank call waits inside its own reliability.timeouts_s.rerank deadline.
    max_workers: 8
  stats:
    n_resamples: 2000
    seed: 17
    alpha: 0.05
  sim:
    model_role: fast
    model: null
    temperature: 0.4
    seed: 27
    repeats: 3
    nightly_subset_size: 10
    loop_threshold: 3
    validity_sample_size: 10

evaluation:
  sets_dir: eval/sets
  seed: 42
  per_group: 60
  dev_per_group: 30
  phrase_overlap: 0.65
  near_duplicate_threshold: 0.92
  token_duplicate_threshold: 0.90
  split_search_attempts: 2000
  max_model_attributes: 3
  cross_doc_candidates: 240
  draft_mode: template   # fast requires LLM_PROVIDER and LLM_FAST_MODEL; decisions are cached
  no_answer_drafts: eval/drafts/no_answer.yaml
  policy_topics: [returns, refunds, shipping, payments, membership, orders, warranty]
  # Exclude travel, loans, insurance and electric-vehicle FAQs from policy questions.
  faq_categories:
    - Cancellations and Returns
    - Order
    - Payment
    - Shipping
    - Shopping
    - Warranty
    - Login & My Account
    - Flipkart Plus
    - Flipkart First
    - SuperCoins
    - Gift Cards
    - Privacy & Security
  customer_id: CUST-0001

index:
  live_alias: support_chunks_live
  collection_prefix: support_chunks_b
  builds_directory: builds
  preview_directory: chunk-preview
  integration_prefix: atlas_test_
  protected_collections:
    - support_chunks
    - support_chunks_eval_heading_on
    - support_chunks_eval_no_heading
    - support_chunks_faq_v1
  alias_ttl_s: 30
  keep_builds: 2
  blocked_postgres_ports: [5432]
  release:
    sets: [dev, smoke]
    # Zero no-answer gate passes is required only where the threshold was tuned (dev).
    # Other no-answer items must not newly pass against the live build (gate_rules.yaml).
    absolute_splits: [dev]
    hit_k: 5
    # An evidence run takes about two hours and may cross a remote link that drops for minutes.
    # A Milvus transport failure retries the same read-only question; ranking is deterministic,
    # so a retry cannot change a result. Waits total about eight minutes before the item errors.
    retry:
      max_attempts: 12
      base_delay_s: 5
      max_delay_s: 60
      jitter_ratio: 0.1
      budget_s: 900
    # Release evidence reuses cross-encoder logits for (query, passage) pairs it already scored.
    # A score is keyed by reranker model, revision, device, fp16, max tokens, batch size, the
    # installed versions of key_packages, the query text and the passage text hash.
    # The file is local and gitignored (.cache/); the serving path never reads it.
    rerank_cache:
      enabled: true
      path: .cache/rerank_scores/scores.sqlite
      key_packages: [FlagEmbedding, torch, transformers]

milvus:
  uri: http://localhost:19530
  collection: support_chunks_live
  timeout_s: 60
  upsert_batch_size: 64
  query_batch_size: 16
  id_max_bytes: 256
  section_max_bytes: 512
  heading_max_bytes: 2048
  text_max_bytes: 65535
  metadata_max_bytes: 128
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64
  sparse_algorithm: DAAT_MAXSCORE
  bm25_k1: 1.2
  bm25_b: 0.75
  analyzer: {tokenizer: standard, filter: [lowercase]}

policy_versions:
  enabled: true
  default_effective_from: 2026-01-01
  open_end_day: 99991231
  spec_path: src/support_agent/data/policy_versions.yaml

orders:
  db_path: data/orders.sqlite
  seed: 42
  n_orders: 300
  n_customers: 50
  today: '2026-11-09'
  currency: USD
  recent_limit: 5
  min_items: 1
  max_items: 4
  max_quantity: 3
  min_unit_price_cents: 1500
  max_unit_price_cents: 50000
  max_order_age_days: 120
  delivery_ages_days: [5, 29, 31, 90]
  shipping_lead_days: 3
  transit_age_days: 7
  tracking_delay_days: 10
  coupon_probability: 0.25
  final_sale_probability: 0.10
  coupon_code: DEMO10
  coupon_discount: 0.10
  fallback_products:
    - {product_id: demo-w40, model: W40, name: Demo W40 Fan, category: home}
    - {product_id: demo-w40-pro, model: W40 Pro, name: Demo W40 Pro Fan, category: home}
    - {product_id: demo-w400, model: W400, name: Demo W400 Headphones, category: electronics}
    - {product_id: demo-shirt, model: T100, name: Demo T100 Shirt, category: clothing}

memory:
  recent_turns: 6
  summary_max_tokens: 400
  short_term:
    enabled: true
    strategy: chunked
    pinned_facts_enabled: true
    compaction_enabled: true
    chunk_turns: 6
    history_budget: 1600
    summary_budget: 600
    low_watermark: 0.6
    summariser_role: fast
    llm_fact_extraction: false
  long_term:
    enabled: false
    allowed_kinds: [open_issue, preference, product_owned, past_resolution]
    ttl_days:
      open_issue: 30
      preference: 365
      product_owned: 365
      past_resolution: 90
    min_confidence: 0.7
    max_content_chars: 240
    min_content_chars: 6
    max_memories_per_customer: 50
    session_top_k: 5
    session_budget_tokens: 300
    mid_turn_top_k: 2
    mid_turn_min_relevance: 0.35
    dedupe_similarity_threshold: 0.80
    supersede_similarity_threshold: 0.45
    extractor_role: fast
    extract_on_handoff: true
    extract_on_end: true
    sqlite_path: data/processed/memories.sqlite

context:
  enabled: true
  strategy: chunked          # chunked | sliding | rolling | chunked_nocache
  sliding_window_turns: 4
  chars_per_token: 3.8
  message_overhead_tokens: 4
  hard_history_turn_cap: 16
  cache_read_multiplier: 0.1
  cache_write_multiplier: 1.0
  cache_adapter:
    provider: auto
    max_breakpoints: 4
    min_cacheable_tokens: 1024
    layer_ttls:
      L0_global: 3600
      L1_session: 300
      L2_compacted: 300
      L3_history: 300
  profiles:
    rewrite: {total_tokens: 4096, history_max_tokens: 1600, evidence_min_ratio: 0.0, share_prefix: true}
    classify: {total_tokens: 2048, history_max_tokens: 400, evidence_min_ratio: 0.0, share_prefix: false, recent_turns: 2}
    plan: {total_tokens: 2048, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}
    input_guard: {total_tokens: 1024, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}
    answer: {total_tokens: 12000, history_max_tokens: 3000, evidence_min_ratio: 0.40, share_prefix: true}
    tools: {total_tokens: 8192, history_max_tokens: 2048, evidence_min_ratio: 0.0, share_prefix: true}
    decide: {total_tokens: 8192, history_max_tokens: 1500, evidence_min_ratio: 0.35, share_prefix: true}
    complaint: {total_tokens: 4096, history_max_tokens: 1024, evidence_min_ratio: 0.0, share_prefix: true}
    verify: {total_tokens: 8192, history_max_tokens: 0, evidence_min_ratio: 0.50, share_prefix: false}
    split_claims: {total_tokens: 4096, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}
    order_extract: {total_tokens: 2048, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}
    grounding: {total_tokens: 4096, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}
    summarise: {total_tokens: 6144, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: true}
    extract_facts: {total_tokens: 2048, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}
    extract_memories: {total_tokens: 3072, history_max_tokens: 0, evidence_min_ratio: 0.0, share_prefix: false}

tracing:
  enabled: false        # also needs LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY; see docs/OBSERVABILITY.md
  redact_inputs: false  # true: customer text never leaves the process (demo default is false)
  max_chunks: 5         # retrieval spans keep chunk ids and scores only, never chunk text

costs:
  # USD per 1M tokens, keyed by the model name the provider reports in responses.
  # UPDATE ME: null means "price not set" and cost is reported as unknown, never guessed.
  # Fill both rates from the provider's price page and set `checked` to that date.
  prices:
    deepseek-v4.1-flash: {input_per_million_usd: null, output_per_million_usd: null, checked: null}

guardrails:
  input:
    patterns_file: src/support_agent/guardrails/patterns.yaml
    classifier:
      enabled: false
      model_role: fast
  output:
    prompt_leak: true
    foreign_pii: true
    commitments: true
    prompt_word_window: 12

api:
  host: 127.0.0.1
  port: 8000
  token_chunk_words: 4
  demo_customer_limit: 8
  max_message_chars: 4000
  max_resume_chars: 128
  health_timeout_s: 2
  max_body_bytes: 131072
  session:
    ttl_s: 3600
  rate_limit:
    window_s: 60
    per_customer: 30
    per_ip: 120
  warmup_retriever: false

db:
  backend: sqlite
  pool_size: 5
  max_overflow: 0
  pool_timeout_s: 5
  connect_timeout_s: 5
  pool_pre_ping: true

redis:
  backend: "null"
  connect_timeout_s: 2
  socket_timeout_s: 2

cache:
  enabled: true
  key_prefix: atlas:cache:v1
  index_revision_ttl_s: 2592000
  embedding:
    enabled: true
    ttl_s: 604800
  retrieval:
    enabled: true
    ttl_s: 86400
  answer:
    enabled: true
    ttl_s: 3600
    recent_turns: 6
    near_duplicate:
      enabled: false
      similarity_threshold: 0.97
      max_entries_per_bucket: 64

readiness:
  postgres_timeout_s: 2
  migrations_timeout_s: 2
  redis_timeout_s: 2
  milvus_timeout_s: 2

handoff:
  queue_enabled: false
  human_mode_enabled: false
  sqlite_path: data/processed/handoffs.sqlite
  demo_agent_token: atlas-demo-agent
  priorities:
    complaint: high
    guardrail_blocked: high
    low_evidence: normal
    low_grounding: normal
    incomplete_evidence: normal
    unsupported_part: normal
    policy_requires_human: normal
    user_requested: normal
    default: normal
