[project]
name = "support-agent"
version = "0.1.0"
description = "English e-commerce after-sales support agent: LangGraph, hybrid RAG and an evidence gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pymilvus>=2.5",
    "FlagEmbedding>=1.3",
    "datasets>=3.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pypdf>=5.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "redis>=6,<8",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
tracing = ["langfuse>=3.0"]
deepseek = [
    "langchain-deepseek>=1.1.1",
]
sqlite = [
    "langgraph-checkpoint-sqlite>=3.1.3",
]
postgres = [
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
]
loadtest = [
    "locust>=2.30",
]
# Other provider packages can be added when needed; DeepSeek is an opt-in extra.

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "matplotlib>=3.9",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
"eval/failures.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["support_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "FlagEmbedding.*", "datasets.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]
addopts = "-ra -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Milvus, Docker or a real LLM; run with `pytest -m integration`",
]
