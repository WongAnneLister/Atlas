false_accept_max: 0
# A baseline must reflect the system, not an outage. Promotion refuses a run where
# more than this share of items hit a classification, retrieval or answer error
# (for example 402 Insufficient Balance or a dropped Milvus tunnel). The small
# allowance covers occasional malformed model output, seen in earlier full runs.
promotion_max_error_rate: 0.05
metrics:
  false_accept:
    direction: lower
    test: mcnemar
  false_reject:
    direction: lower
    test: mcnemar
  pass_rate:
    direction: higher
    test: mcnemar
  graph_recall_at_5:
    direction: higher
    test: bootstrap
  citation_validity:
    direction: higher
    test: bootstrap
  latency_p95:
    direction: lower
    test: bootstrap
    statistic: p95
    # Latency depends on the runner, the SSH tunnel and shared CPU/MPS load more
    # than on the change under test, so a slower run is reported, not blocked.
    blocking: false
redteam: []
comparison_lower_is_better:
  - "*false_accept"
  - "*false_reject"
  - "*latency*"
  - "*token_p*"
  - "*cost*"
  - "*fail*"
  - "judge_flagged"
  - "human_confirmed"
