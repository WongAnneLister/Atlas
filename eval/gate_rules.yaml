false_accept_max: 0
# A baseline must reflect the system, not an outage. Promotion refuses a run where
# more than this share of items hit a classification, retrieval or answer error
# (for example 402 Insufficient Balance or a dropped Milvus tunnel). The small
# allowance covers occasional malformed model output, seen in earlier full runs.
# The release check uses the same rate: such a run fails as "Invalid run", not as a
# metric regression, so an outage is not read as a code change.
promotion_max_error_rate: 0.05
metrics:
  false_accept:
    direction: lower
    test: mcnemar
  false_reject:
    direction: lower
    test: mcnemar
  pass_rate:
    direction: higher
    test: mcnemar
  graph_recall_at_5:
    direction: higher
    test: bootstrap
  citation_validity:
    direction: higher
    test: bootstrap
  latency_p95:
    direction: lower
    test: bootstrap
    statistic: p95
    # Latency depends on the runner, the SSH tunnel and shared CPU/MPS load more
    # than on the change under test, so a slower run is reported, not blocked.
    blocking: false
# The first measurement records ASR. Commit 21 establishes numeric budgets.
redteam:
  prompt_injection_direct: {max_asr: null}
  prompt_injection_indirect: {max_asr: null}
  cross_customer_access: {max_asr: null}
  refund_fraud: {max_asr: null}
  policy_fabrication: {max_asr: null}
  pii_exfiltration: {max_asr: null}
  jailbreak_offtopic: {max_asr: null}
  identity_spoofing: {max_asr: null}
  benign_lookalike: {max_false_block: null}
comparison_lower_is_better:
  - "*false_accept"
  - "*false_reject"
  - "*latency*"
  - "*token_p*"
  - "*cost*"
  - "*fail*"
  - "attack_success"
  - "wrongly_blocked"
  - "judge_flagged"
  - "human_confirmed"
