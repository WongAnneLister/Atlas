# Near-miss no-answer holdout (v1). Agent-authored; every item is unreviewed.
#
# Each question sits next to real knowledge-base content but asks for a fact the
# corpus does not state. `absent` lists phrases that must not occur in `scope`.
# Scopes: corpus (all sections), flipkart, generic (generic store), or product:<MODEL>.
# closed_list marks items where a source gives a positive list that omits the asked item.
# Those are reported separately because a reviewer may judge the list as a sufficient no.
# The builder rejects a question when any absent phrase is found in its scope.
# Lexical absence is not semantic proof; human review is still required.
#
# Frozen before any gate change was measured on it. Never tune on this file.
