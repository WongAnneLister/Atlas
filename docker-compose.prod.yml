# Production single-VM deployment stack with automatic HTTPS via Caddy.
# Secrets MUST be provided via environment or a non-committed .env file.
name: support-agent-prod

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ATLAS_IMAGE:-support-agent:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg://${ATLAS_POSTGRES_USER:-support}:${ATLAS_POSTGRES_PASSWORD:?set ATLAS_POSTGRES_PASSWORD}@postgres:5432/${ATLAS_POSTGRES_DB:-support}
      REDIS_URL: redis://redis:6379/0
      SUPPORT_AGENT__MILVUS__URI: http://milvus:19530
      SUPPORT_AGENT__DB__BACKEND: postgres
      SUPPORT_AGENT__GRAPH__CHECKPOINT_BACKEND: postgres
      SUPPORT_AGENT__REDIS__BACKEND: redis
      DEMO_DAILY_SPEND_CAP_USD: ${DEMO_DAILY_SPEND_CAP_USD:-5.0}
    volumes:
      - model_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ATLAS_POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?set ATLAS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ATLAS_POSTGRES_DB:-support}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 15s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: ["server", "/minio_data"]
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 15s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.10
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 15s
      retries: 3
    depends_on:
      - etcd
      - minio

volumes:
  caddy_data:
  caddy_config:
  model_cache:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
